name: GCP Deploy - Standard pipeline

on:      
  workflow_call:
    inputs:
      target_platform:    # arm, x86 or ci (without target platform)
        required: true
        type: string
      docker_file_contains_target_platform_in_name:
        type: boolean
        default: true
      runner_vm:
        required: true
        type: string
      # GCP Variables:
      gcp_project_id:
        required: true
        type: string
      gke_cluster:
        required: true
        type: string
      gke_zone:
        required: false
        type: string
        default: "southamerica-east1"
      gke_service_account:
        required: true
        type: string
      k8s_namespace:
        required: false
        type: string
      artifact_registry_region:
        required: false
        type: string
        default: "southamerica-east1"
      artifact_registry_repo:
        required: false
        type: string
        default: fnzr-repo
      values_path:
        required: false
        type: string
        default: values.yaml
      set_values:
        description: "Optional values for --set in helm command"
        required: false
        type: string
      docker_build_args:
        description: "Optional extra Docker build args, one KEY=VALUE per line"
        required: false
        type: string


    secrets:
      GCP_SERVICE_ACCOUNT_KEY:
        required: true
      GCP_GENAI_KEY:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      FNZ_REPOSITORIES_KEY:
        required: false
      JWT_PRIVATE_KEY:
        required: false
      JWT_PUBLIC_KEY:
        required: false

jobs:
  building:
    name: Building project
    runs-on:
        labels: ${{inputs.runner_vm}}

    env:
      CI: true
      NPM_FINANZERO_SECRET: ${{secrets.NPM_FINANZERO_SECRET}}
      GCP_PROJECT_ID: ${{inputs.gcp_project_id}}
      ARTIFACT_REGISTRY_HOST: "${{inputs.artifact_registry_region}}-docker.pkg.dev"
      ARTIFACT_REGISTRY_REPO: "${{inputs.artifact_registry_repo}}"
      DOCKER_BUILD_ARGS: ${{inputs.docker_build_args}}

    outputs:
      project_name: ${{ steps.building.outputs.project_name }}
      image_tag: ${{ steps.building.outputs.image_tag }}
      image_name: ${{ steps.building.outputs.image_name_with_platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud Platform (GCP)
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Setup gcloud CLI
        id: setup-gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1
  
      - name: Describe commit ID
        id: describe-commit-id
        run: |
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Configure Docker Auth to Artifact Registry (GCP)
        id: docker-host-auth
        uses: 'docker/login-action@v4'
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: _json_key
          password: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Create Artifact Registry (If not exists)
        id: create-artifact-registry
        run: |
          gcloud artifacts repositories create ${ARTIFACT_REGISTRY_REPO} --repository-format=docker --location=${{inputs.artifact_registry_region}} || echo 'Docker Repository already exists (probably)'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Building and Uploading Docker Image to GCP
        id: building
        run: |
          export PROJECT_NAME=${PROJECT_NAME:-`basename "$PWD"`}

          export IMAGE_TAG=${IMAGE_TAG:-"local-`git rev-parse --short HEAD`"}
          export IMAGE_NAME="${ARTIFACT_REGISTRY_HOST}/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${PROJECT_NAME}"
          export IMAGE_NAME_WITH_PLATFORM="${IMAGE_NAME}:${{inputs.target_platform}}"

          export NPM_FINANZERO_SECRET=${NPM_FINANZERO_SECRET:-"$(cat ~/.npmrc)"}

          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image_name_with_platform=$IMAGE_NAME_WITH_PLATFORM" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "current version=${{steps.package-version.outputs.current-version}}"
          echo "current commit=$COMMIT_ID"

          EXTRA_BUILD_ARGS=()
          while IFS= read -r arg; do
            [ -n "$arg" ] && EXTRA_BUILD_ARGS+=(--build-arg "$arg")
          done <<< "$DOCKER_BUILD_ARGS"

          # :pre-build is only ever pushed when skip-deploy is set, same as
          # before the buildx switch below.
          TAGS=(-t "${IMAGE_NAME_WITH_PLATFORM}-latest" -t "${IMAGE_NAME_WITH_PLATFORM}-$IMAGE_TAG")
          if [[ ${{contains( github.event.pull_request.labels.*.name, 'skip-deploy')}} = 'true' ]]; then
            TAGS+=(-t "${IMAGE_NAME}:pre-build")
          fi

          # --cache-from/--cache-to type=registry persists Docker layer
          # caching (apt installs, `go mod download`, npm installs
          # depending on the Dockerfile) across these otherwise-ephemeral
          # GitHub-hosted runners, using a dedicated tag in the same
          # Artifact Registry repo this workflow already pushes images to.
          # type=gha was tried first but never hit: GHA cache entries are
          # scoped per branch/workflow-identity, and this build runs inside
          # a reusable workflow invoked from other repos, so writes and
          # reads landed in different partitions. A private registry has
          # no such scoping and is shared across every branch/repo that
          # calls this workflow, so mode=max is safe here (no build-arg
          # exposure concern like GHA cache has) and necessary to carry
          # intermediate RUN layers.
          #
          # --provenance=false skips buildx's default build-provenance
          # attestation. That attestation does a second, mostly-uncached
          # solve of the Dockerfile purely to produce SBOM/provenance
          # metadata, which was quietly eating the time the cache above is
          # supposed to save. These are internal images pushed straight to
          # our own Artifact Registry and deployed to our own GKE cluster,
          # so supply-chain attestation isn't providing value here.
          export BUILD_CACHE_REF="${IMAGE_NAME}:buildcache-${{inputs.target_platform}}"

          docker buildx build \
              --build-arg FNZ_REPOSITORIES_KEY="${{secrets.FNZ_REPOSITORIES_KEY}}" \
              --build-arg NPM_RC="$NPM_FINANZERO_SECRET" \
              --build-arg VERSION_ID=${{steps.package-version.outputs.current-version}} \
              --build-arg COMMIT_ID=$COMMIT_ID \
              "${EXTRA_BUILD_ARGS[@]}" \
              --push \
              --provenance=false \
              "${TAGS[@]}" \
              --cache-from type=registry,ref=$BUILD_CACHE_REF \
              --cache-to type=registry,ref=$BUILD_CACHE_REF,mode=max \
              -f ./Dockerfile_${{ inputs.docker_file_contains_target_platform_in_name && inputs.target_platform || 'ci' }} .

          echo "################# Uploaded docker image to Docker Repository ##################"
          echo "Pushed image ${IMAGE_NAME_WITH_PLATFORM}-latest"
          echo "Pushed image ${IMAGE_NAME_WITH_PLATFORM}-$IMAGE_TAG"

          if [[ ${{contains( github.event.pull_request.labels.*.name, 'skip-deploy')}} = 'true' ]]; then
            echo "Pushed image ${IMAGE_NAME}:pre-build"
          fi

  deploying:
    if: ${{ !contains( github.event.pull_request.labels.*.name, 'skip-deploy') }}
    name: Deploying ${{inputs.target_platform}} project
    runs-on:
      labels: ${{inputs.runner_vm}}

    needs: building
    env:
      CI: true
      GCP_PROJECT_ID: ${{inputs.gcp_project_id}}
      GKE_SERVICE_ACCOUNT: ${{inputs.gke_service_account}}
      VALUES_PATH: ${{inputs.values_path}}
      K8S_NAMESPACE: ${{inputs.k8s_namespace}}
      PROJECT_NAME: ${{needs.building.outputs.project_name}}
      IMAGE_NAME: ${{needs.building.outputs.image_name}}
      IMAGE_TAG: ${{needs.building.outputs.image_tag}}
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud Platform (GCP)
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up GKE credentials
        id: get-gke-credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ inputs.gke_cluster }}
          location: ${{ inputs.gke_zone }}

      # Install helm
      - name: Install Helm
        id: helm-install
        run: |
          curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | bash

      - name: Generate variables to K8S deploy
        id: k8s-deploy-envs
        run: |
          export PROJECT_NAME_TO_K8S_NAMESPACE=$(echo "${PROJECT_NAME}" | tr -cd '[:alnum:]' | tr '[:upper:]' '[:lower:]')
          export K8S_NAMESPACE=${K8S_NAMESPACE:-${PROJECT_NAME_TO_K8S_NAMESPACE}}
          export K8S_SERVICE_ACCOUNT="${K8S_NAMESPACE}-sa"

          echo "K8S_NAMESPACE=${K8S_NAMESPACE}" >> "$GITHUB_ENV"
          echo "K8S_SERVICE_ACCOUNT=${K8S_SERVICE_ACCOUNT}" >> "$GITHUB_ENV"

      - name: Bind Service Account from GKE and GCP IAM
        id: bind-sa-gke-iam
        run: |
          gcloud iam service-accounts add-iam-policy-binding ${GKE_SERVICE_ACCOUNT} \
            --member="serviceAccount:${GCP_PROJECT_ID}.svc.id.goog[${K8S_NAMESPACE}/${K8S_SERVICE_ACCOUNT}]" \
            --role="roles/iam.workloadIdentityUser"

      - name: Deploy the Docker image to the Kubernetes cluster
        id: k8s-deploy
        run: |
          helm upgrade -i \
            ${PROJECT_NAME} chart/ \
            -n ${K8S_NAMESPACE} --create-namespace \
            -f chart/${VALUES_PATH} \
            --set image.name=${IMAGE_NAME}-${IMAGE_TAG} \
            --set serviceAccountName=${K8S_SERVICE_ACCOUNT} \
            --set serviceAccountEmail=${GKE_SERVICE_ACCOUNT} \
            $(if [ "${{ inputs.set_values }}" ]; then echo "--set ${{ inputs.set_values }}"; fi) \
            --set AWS_ACCESS_KEY_ID=${{secrets.AWS_ACCESS_KEY_ID}} \
            --set AWS_SECRET_ACCESS_KEY=${{secrets.AWS_SECRET_ACCESS_KEY}} \
            --set GCP_GENAI_KEY=${{secrets.GCP_GENAI_KEY}} \
            $(if [ -n "${{ secrets.JWT_PRIVATE_KEY }}" ]; then echo "--set-string secrets.JWT_PRIVATE_KEY=${{ secrets.JWT_PRIVATE_KEY }}"; fi) \
            $(if [ -n "${{ secrets.JWT_PUBLIC_KEY }}" ]; then echo "--set-string secrets.JWT_PUBLIC_KEY=${{ secrets.JWT_PUBLIC_KEY }}"; fi) \
            --wait --timeout=5m0s --atomic --debug

          kubectl get services -n ${K8S_NAMESPACE} -o wide

          echo 'Project published successfully'