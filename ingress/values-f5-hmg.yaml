controller:
  replicaCount: 1
  # New class name to avoid conflicts with existing NGINX Ingress Controller
  ingressClass:
    name: nginx-f5
    create: true
    setAsDefaultIngress: true # Alterado para true
  
    # Serviço interno mantendo a integração com o GCP NEG  
  service:
    create: true
    type: ClusterIP
    annotations:
      cloud.google.com/neg: '{"exposed_ports": {"80":{"name": "f5-ingress-80-neg"}}}'

